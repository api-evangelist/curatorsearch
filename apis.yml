name: CuratorSearch
description: >-
  An independent, daily-refreshed record of museum/gallery/curatorial vacancies and advertised salaries, aggregated from
  400+ institutions' careers pages. Exposes a keyless REST/JSON API, an OpenAPI 3.1 contract, a hosted MCP server,
  llms.txt, open datasets (CC BY 4.0, with DOI), and RSS.
